# Model parameters
embedding_dim: 64
n_layers: 3
reg_weight: 0.0001
ssl_temp: 0.05
ssl_reg: 1e-6
hyper_layers: 1
alpha: 0.5
proto_reg: 5e-8
num_clusters: 8
clip_grad_norm: 5

# Training parameters
lr: 0.001
weight_decay: 1e-5
batch_size: 256
epochs: 100
eval_step: 10
num_m_step: 5
patience: 10
k_folds: 10
num_repeats: 50
apply_smote: true

# Dataset paths
data_path: "../data/Gdataset.mat"
output_dir: "../results"